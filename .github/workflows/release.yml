name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'NoteAITask/NoteAITask.csproj'
  BUILD_CONFIG: 'Release'
  MIN_SIZE_MB: 10

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    outputs:
      status: ${{ job.status }}
      asset_name: ${{ steps.file-info.outputs.ASSET_NAME }}
      size_mb: ${{ steps.file-info.outputs.SIZE_MB }}
    env:
      RUNTIME: 'win-x64'
      ARTIFACT_NAME: 'NoteAITask-Windows-x64'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Obfuscar Global Tool
        run: dotnet tool install --global Obfuscar.GlobalTool

      - name: Step 1 - Build Loose Assemblies
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=false

      - name: Find Publish Directory (After Build)
        id: find-dirs
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path "NoteAITask/bin/${{ env.BUILD_CONFIG }}" -Directory -Filter "*${{ env.RUNTIME }}*" -Recurse | Select-Object -First 1

          if (-not $publishDir) {
            Write-Host "❌ Publish directory not found!"
            Write-Host "Contents of NoteAITask/bin:"
            Get-ChildItem "NoteAITask/bin" -Recurse
            exit 1
          }

          $publishPath = Join-Path $publishDir.FullName "publish"
          echo "PUBLISH_DIR=$publishPath" >> $env:GITHUB_OUTPUT
          Write-Host "✅ Found publish dir: $publishPath"

      - name: Step 2 & 3 - Run Obfuscar & Replace Assembly
        shell: pwsh
        run: |
          $publishDir = "${{ steps.find-dirs.outputs.PUBLISH_DIR }}"
          $obfuscarXml = "obfuscar.xml"
          $obfuscarPath = if (Test-Path $obfuscarXml) {
            (Resolve-Path $obfuscarXml).Path
          } else {
            (Resolve-Path "NoteAITask/obfuscar.xml").Path
          }

          if (-not (Test-Path $obfuscarPath)) {
            Write-Host "❌ obfuscar.xml not found at: $obfuscarPath"
            exit 1
          }

          Push-Location $publishDir
          Write-Host "Running Obfuscar from: $(Get-Location)"
          Write-Host "Config file: $obfuscarPath"

          obfuscar.console $obfuscarPath
          $obfuscationResult = $LASTEXITCODE

          if ($obfuscationResult -ne 0) {
            Write-Host "❌ Obfuscar failed with exit code: $obfuscationResult"
            Pop-Location
            exit 1
          }

          if (Test-Path "./protected/NoteAITask.dll") {
            Copy-Item -Path "./protected/NoteAITask.dll" -Destination "./NoteAITask.dll" -Force
            Remove-Item -Path "./protected" -Recurse -Force
            Write-Host "✅ Obfuscated Windows assembly applied."
          } else {
            Write-Host "❌ Protected DLL not found after obfuscation!"
            Pop-Location
            exit 1
          }

          Pop-Location

      - name: Step 4 - Final Single-File Bundle
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=false --no-restore

      - name: Verify Build Output
        shell: pwsh
        run: |
          $exePath = Join-Path "${{ steps.find-dirs.outputs.PUBLISH_DIR }}" "NoteAITask.exe"
          if (-not (Test-Path $exePath)) {
            Write-Host "❌ Build failed: NoteAITask.exe not found at $exePath"
            exit 1
          }
          $fileSize = (Get-Item $exePath).Length / 1MB
          Write-Host "✅ Build successful. File size: $([Math]::Round($fileSize, 2)) MB"

      - name: Rename Output Binary
        shell: pwsh
        run: |
          $publishDir = "${{ steps.find-dirs.outputs.PUBLISH_DIR }}"
          $exePath = Join-Path $publishDir "NoteAITask.exe"
          $renamedPath = Join-Path $publishDir "${{ env.ARTIFACT_NAME }}.exe"

          if (-not (Test-Path $exePath)) {
            Write-Host "❌ Executable not found: $exePath"
            exit 1
          }

          Move-Item -Path $exePath -Destination $renamedPath -Force
          Write-Host "✅ Renamed to: $(Split-Path $renamedPath -Leaf)"

      - name: Capture & Verify Artifact Info
        id: file-info
        shell: pwsh
        run: |
          $exePath = Join-Path "${{ steps.find-dirs.outputs.PUBLISH_DIR }}" "${{ env.ARTIFACT_NAME }}.exe"
          $sizeMb = [Math]::Round((Get-Item $exePath).Length / 1MB, 2)

          echo "ASSET_NAME=${{ env.ARTIFACT_NAME }}.exe" >> $env:GITHUB_OUTPUT
          echo "SIZE_MB=$sizeMb" >> $env:GITHUB_OUTPUT

          if ($sizeMb -lt ${{ env.MIN_SIZE_MB }}) {
            Write-Host "❌ Ukuran binary ${sizeMb}MB di bawah ambang minimum ${{ env.MIN_SIZE_MB }}MB - kemungkinan build corrupt"
            exit 1
          }
          Write-Host "✅ Artifact size OK: ${sizeMb}MB"

      - name: Upload Windows Binary to Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: ${{ steps.find-dirs.outputs.PUBLISH_DIR }}/${{ env.ARTIFACT_NAME }}.exe
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
      asset_name: ${{ steps.file-info.outputs.ASSET_NAME }}
      size_mb: ${{ steps.file-info.outputs.SIZE_MB }}
    env:
      RUNTIME: 'linux-x64'
      ARTIFACT_NAME: 'NoteAITask-Linux-x64'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Obfuscar Global Tool
        run: dotnet tool install --global Obfuscar.GlobalTool

      - name: Add .NET Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Step 1 - Build Loose Assemblies
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=false

      - name: Step 2 - Run Obfuscar (Linux)
        continue-on-error: true
        run: |
          PUBLISH_DIR="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish"
          OBFUSCAR_XML="NoteAITask/obfuscar.xml"

          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "⚠️ Publish directory not found, skipping obfuscation"
            exit 0
          fi

          if [ ! -f "$OBFUSCAR_XML" ]; then
            echo "⚠️ obfuscar.xml not found, skipping obfuscation"
            exit 0
          fi

          cd "$PUBLISH_DIR"
          echo "Running Obfuscar from: $(pwd)"

          $HOME/.dotnet/tools/obfuscar.console "$(pwd -P)/../../../../../$OBFUSCAR_XML" || echo "⚠️ Obfuscar failed, continuing without obfuscation"

          if [ -f "./protected/NoteAITask.dll" ]; then
            cp -f ./protected/NoteAITask.dll ./NoteAITask.dll
            rm -rf ./protected
            echo "✅ Obfuscated assembly applied."
          fi

      - name: Step 3 - Final Single-File Bundle
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=false --no-restore

      - name: Verify Build Output
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/NoteAITask"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Build failed: Binary not found at $BINARY_PATH"
            exit 1
          fi

          FILE_SIZE=$(du -h "$BINARY_PATH" | cut -f1)
          echo "✅ Build successful. File size: $FILE_SIZE"

      - name: Rename Output Binary
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/NoteAITask"
          PUBLISH_DIR="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish"
          RENAMED_PATH="$PUBLISH_DIR/${{ env.ARTIFACT_NAME }}"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Binary not found: $BINARY_PATH"
            exit 1
          fi

          mv "$BINARY_PATH" "$RENAMED_PATH"
          echo "✅ Renamed to: $(basename $RENAMED_PATH)"

      - name: Make Linux Binary Executable
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/${{ env.ARTIFACT_NAME }}"
          chmod +x "$BINARY_PATH"
          echo "✅ Binary is executable"

      - name: Capture & Verify Artifact Info
        id: file-info
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/${{ env.ARTIFACT_NAME }}"
          SIZE_BYTES=$(stat -c%s "$BINARY_PATH")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

          echo "ASSET_NAME=${{ env.ARTIFACT_NAME }}" >> "$GITHUB_OUTPUT"
          echo "SIZE_MB=$SIZE_MB" >> "$GITHUB_OUTPUT"

          if (( $(echo "$SIZE_MB < ${{ env.MIN_SIZE_MB }}" | bc -l) )); then
            echo "❌ Ukuran binary ${SIZE_MB}MB di bawah ambang minimum ${{ env.MIN_SIZE_MB }}MB - kemungkinan build corrupt"
            exit 1
          fi
          echo "✅ Artifact size OK: ${SIZE_MB}MB"

      - name: Upload Linux Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/${{ env.ARTIFACT_NAME }}
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Verify & Notify
    needs: [build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Determine Overall Status
        id: verify
        run: |
          WIN_RESULT="${{ needs.build-windows.result }}"
          LINUX_RESULT="${{ needs.build-linux.result }}"

          [ "$WIN_RESULT" = "success" ] && WIN_STATUS="✅" || WIN_STATUS="❌"
          [ "$LINUX_RESULT" = "success" ] && LINUX_STATUS="✅" || LINUX_STATUS="❌"

          if [ "$WIN_RESULT" = "success" ] && [ "$LINUX_RESULT" = "success" ]; then
            VERIFY_SUCCESS=true
          else
            VERIFY_SUCCESS=false
          fi

          echo "WIN_STATUS=$WIN_STATUS" >> "$GITHUB_OUTPUT"
          echo "LINUX_STATUS=$LINUX_STATUS" >> "$GITHUB_OUTPUT"
          echo "VERIFY_SUCCESS=$VERIFY_SUCCESS" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification (Success)
        if: steps.verify.outputs.VERIFY_SUCCESS == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "🧪 Pre-Release Verification Success"
          description: |
            **Version:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}

            **Artifacts:**
            ${{ steps.verify.outputs.WIN_STATUS }} Windows: ${{ needs.build-windows.outputs.asset_name }} (${{ needs.build-windows.outputs.size_mb }}MB)
            ${{ steps.verify.outputs.LINUX_STATUS }} Linux: ${{ needs.build-linux.outputs.asset_name }} (${{ needs.build-linux.outputs.size_mb }}MB)

            Both binaries verified and available for download!

      - name: Send Discord Notification (Failure)
        if: steps.verify.outputs.VERIFY_SUCCESS != 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Pre-Release Verification Failed"
          description: |
            **Version:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}

            **Status:**
            ${{ steps.verify.outputs.WIN_STATUS }} Windows build: ${{ needs.build-windows.result }}
            ${{ steps.verify.outputs.LINUX_STATUS }} Linux build: ${{ needs.build-linux.result }}

            One or more builds failed!

      - name: Create Issue on Failure
        if: steps.verify.outputs.VERIFY_SUCCESS != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Release ${{ github.ref_name }} - Build Verification Failed`,
              body: `## Build Verification Failed\n\n**Version:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\n**Author:** ${{ github.actor }}\n\n### Status:\n- Windows: ${{ needs.build-windows.result }}\n- Linux: ${{ needs.build-linux.result }}\n\nPlease check the individual job logs and re-tag/re-push if needed.`,
              labels: ['bug', 'release']
            })
