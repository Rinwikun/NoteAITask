name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: WINDOWS BUILD & OBFUSCATE
  # ==========================================
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Obfuscar Global Tool
        run: dotnet tool install --global Obfuscar.GlobalTool

      - name: Step 1 - Build Loose Assemblies (Windows)
        run: dotnet publish NoteAITask/NoteAITask.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=false

      - name: Step 2 & 3 - Run Obfuscar & Replace DLL
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "NoteAITask/bin/Release/net10.0/win-x64/publish"
          $obfuscarXml = "obfuscar.xml"
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $obfuscarXml))) {
              $obfuscarXml = "NoteAITask/obfuscar.xml"
          }
          $obfuscarPath = Join-Path $env:GITHUB_WORKSPACE $obfuscarXml

          Set-Location $publishDir
          obfuscar.console $obfuscarPath

          if (Test-Path "./protected/NoteAITask.dll") {
              Copy-Item -Path "./protected/NoteAITask.dll" -Destination "./NoteAITask.dll" -Force
              Remove-Item -Path "./protected" -Recurse -Force
              Write-Host "✅ Obfuscated Windows DLL replaced successfully!"
          }

      - name: Step 4 - Final Single-File Bundle
        run: dotnet publish NoteAITask/NoteAITask.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=false --no-restore

      - name: Rename Output Binary
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "NoteAITask/bin/Release/net10.0/win-x64/publish"
          Move-Item -Path "$publishDir/NoteAITask.exe" -Destination "$publishDir/NoteAITask-Windows-x64.exe" -Force

      - name: Upload Windows Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoteAITask/bin/Release/net10.0/win-x64/publish/NoteAITask-Windows-x64.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 2: LINUX BUILD & OBFUSCATE
  # ==========================================
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Obfuscar Global Tool
        run: dotnet tool install --global Obfuscar.GlobalTool

      - name: Add .NET Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Step 1 - Build Loose Assemblies (Linux)
        run: dotnet publish NoteAITask/NoteAITask.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=false

      - name: Step 2 & 3 - Run Obfuscar & Replace DLL
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "NoteAITask/bin/Release/net10.0/linux-x64/publish"
          $obfuscarXml = "obfuscar.xml"
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $obfuscarXml))) {
              $obfuscarXml = "NoteAITask/obfuscar.xml"
          }
          $obfuscarPath = Join-Path $env:GITHUB_WORKSPACE $obfuscarXml

          Set-Location $publishDir

          # Di Linux, eksekusi global tool via dotnet tool / direct binary
          if (Get-Command obfuscar.console -ErrorAction SilentlyContinue) {
              obfuscar.console $obfuscarPath
          } else {
              & "$env:HOME/.dotnet/tools/obfuscar.console" $obfuscarPath
          }

          if (Test-Path "./protected/NoteAITask.dll") {
              Copy-Item -Path "./protected/NoteAITask.dll" -Destination "./NoteAITask.dll" -Force
              Remove-Item -Path "./protected" -Recurse -Force
              Write-Host "✅ Obfuscated Linux DLL replaced successfully!"
          }

      - name: Step 4 - Final Single-File Bundle
        run: dotnet publish NoteAITask/NoteAITask.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=false --no-restore

      - name: Prepare Artifact Executable
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "NoteAITask/bin/Release/net10.0/linux-x64/publish"
          Move-Item -Path "$publishDir/NoteAITask" -Destination "$publishDir/NoteAITask-Linux-x64" -Force

      - name: Make Linux Binary Executable
        run: chmod +x NoteAITask/bin/Release/net10.0/linux-x64/publish/NoteAITask-Linux-x64

      - name: Upload Linux Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoteAITask/bin/Release/net10.0/linux-x64/publish/NoteAITask-Linux-x64
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}