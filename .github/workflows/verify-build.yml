name: Verify Release

on:
  workflow_run:
    workflows: ["Release Windows", "Release Linux"]
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - Check Latest Release
        run: |
          echo "=== Checking Latest Release ==="
          curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq '.'
          
          echo ""
          echo "=== All Releases ==="
          curl -s https://api.github.com/repos/${{ github.repository }}/releases | jq '.[] | {tag_name, assets}'

      - name: Get Release Info
        id: release-info
        run: |
          RELEASE_DATA=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          
          echo "=== Raw Release Data ==="
          echo "$RELEASE_DATA" | jq '.'
          
          TAG_NAME=$(echo "$RELEASE_DATA" | jq -r '.tag_name // "unknown"')
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Count assets
          ASSET_COUNT=$(echo "$RELEASE_DATA" | jq '.assets | length')
          echo "ASSET_COUNT=$ASSET_COUNT" >> $GITHUB_OUTPUT
          
          echo "✅ Tag: $TAG_NAME, Assets: $ASSET_COUNT"

      - name: Verify Release
        run: |
          echo "Tag Name: ${{ steps.release-info.outputs.TAG_NAME }}"
          echo "Asset Count: ${{ steps.release-info.outputs.ASSET_COUNT }}"
          
          if [ "${{ steps.release-info.outputs.ASSET_COUNT }}" -eq 0 ]; then
            echo "❌ No assets found in release!"
            exit 1
          fi
          
          echo "✅ Release has assets"