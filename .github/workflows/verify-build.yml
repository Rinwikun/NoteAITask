name: Verify Release

on:
  workflow_run:
    workflows: ["Release Windows", "Release Linux"]
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Release Info
        id: release-info
        run: |
          # Get latest release
          RELEASE_DATA=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest)
          
          # Extract info
          TAG_NAME=$(echo $RELEASE_DATA | jq -r '.tag_name')
          RELEASE_NAME=$(echo $RELEASE_DATA | jq -r '.name')
          CREATED_AT=$(echo $RELEASE_DATA | jq -r '.created_at')
          
          # Get artifacts
          WIN_ASSET=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Windows")) | .name')
          WIN_URL=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Windows")) | .browser_download_url')
          WIN_SIZE=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Windows")) | .size')
          
          LINUX_ASSET=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Linux")) | .name')
          LINUX_URL=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Linux")) | .browser_download_url')
          LINUX_SIZE=$(echo $RELEASE_DATA | jq -r '.assets[] | select(.name | contains("Linux")) | .size')
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "CREATED_AT=$CREATED_AT" >> $GITHUB_OUTPUT
          echo "WIN_ASSET=$WIN_ASSET" >> $GITHUB_OUTPUT
          echo "WIN_URL=$WIN_URL" >> $GITHUB_OUTPUT
          echo "WIN_SIZE=$WIN_SIZE" >> $GITHUB_OUTPUT
          echo "LINUX_ASSET=$LINUX_ASSET" >> $GITHUB_OUTPUT
          echo "LINUX_URL=$LINUX_URL" >> $GITHUB_OUTPUT
          echo "LINUX_SIZE=$LINUX_SIZE" >> $GITHUB_OUTPUT

      - name: Get Commit Info
        id: commit-info
        run: |
          # Get commit info dari tag
          COMMIT_SHA=$(git rev-list -n 1 ${{ steps.release-info.outputs.TAG_NAME }} 2>/dev/null || echo "unknown")
          COMMIT_SHORT=$(echo $COMMIT_SHA | cut -c1-7)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B $COMMIT_SHA 2>/dev/null || echo "N/A")
          COMMIT_AUTHOR=$(git log -1 --pretty=%an $COMMIT_SHA 2>/dev/null || echo "N/A")
          
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

      - name: Verify Artifacts Exist
        id: verify
        run: |
          WIN_SIZE="${{ steps.release-info.outputs.WIN_SIZE }}"
          LINUX_SIZE="${{ steps.release-info.outputs.LINUX_SIZE }}"
          
          MIN_SIZE=10485760  # 10MB minimum
          
          WIN_STATUS="❌"
          LINUX_STATUS="❌"
          VERIFY_SUCCESS=false
          
          if [ ! -z "$WIN_SIZE" ] && [ "$WIN_SIZE" -gt $MIN_SIZE ]; then
            WIN_STATUS="✅"
          fi
          
          if [ ! -z "$LINUX_SIZE" ] && [ "$LINUX_SIZE" -gt $MIN_SIZE ]; then
            LINUX_STATUS="✅"
          fi
          
          if [ "$WIN_STATUS" = "✅" ] && [ "$LINUX_STATUS" = "✅" ]; then
            VERIFY_SUCCESS=true
          fi
          
          echo "WIN_STATUS=$WIN_STATUS" >> $GITHUB_OUTPUT
          echo "LINUX_STATUS=$LINUX_STATUS" >> $GITHUB_OUTPUT
          echo "VERIFY_SUCCESS=$VERIFY_SUCCESS" >> $GITHUB_OUTPUT
          
          # Format size untuk display
          WIN_SIZE_MB=$(echo "scale=2; $WIN_SIZE / 1048576" | bc)
          LINUX_SIZE_MB=$(echo "scale=2; $LINUX_SIZE / 1048576" | bc)
          
          echo "WIN_SIZE_MB=$WIN_SIZE_MB" >> $GITHUB_OUTPUT
          echo "LINUX_SIZE_MB=$LINUX_SIZE_MB" >> $GITHUB_OUTPUT

      - name: Send Discord Notification (Success)
        if: steps.verify.outputs.VERIFY_SUCCESS == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "✅ Release Verification Success"
          description: |
            **Version:** ${{ steps.release-info.outputs.TAG_NAME }}
            **Released:** ${{ steps.release-info.outputs.CREATED_AT }}
            
            **Commit Info:**
            • SHA: `${{ steps.commit-info.outputs.COMMIT_SHORT }}`
            • Author: ${{ steps.commit-info.outputs.COMMIT_AUTHOR }}
            • Message: ${{ steps.commit-info.outputs.COMMIT_MESSAGE }}
            
            **Artifacts:**
            ${{ steps.verify.outputs.WIN_STATUS }} Windows: ${{ steps.release-info.outputs.WIN_ASSET }} (${{ steps.verify.outputs.WIN_SIZE_MB }}MB)
            ${{ steps.verify.outputs.LINUX_STATUS }} Linux: ${{ steps.release-info.outputs.LINUX_ASSET }} (${{ steps.verify.outputs.LINUX_SIZE_MB }}MB)
            
            Both binaries verified and available for download!

      - name: Send Discord Notification (Failure)
        if: steps.verify.outputs.VERIFY_SUCCESS != 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Release Verification Failed"
          description: |
            **Version:** ${{ steps.release-info.outputs.TAG_NAME }}
            
            **Commit Info:**
            • SHA: `${{ steps.commit-info.outputs.COMMIT_SHORT }}`
            • Author: ${{ steps.commit-info.outputs.COMMIT_AUTHOR }}
            
            **Status:**
            ${{ steps.verify.outputs.WIN_STATUS }} Windows: ${{ steps.release-info.outputs.WIN_ASSET }}
            ${{ steps.verify.outputs.LINUX_STATUS }} Linux: ${{ steps.release-info.outputs.LINUX_ASSET }}
            
            One or more artifacts failed verification. Check GitHub releases.

      - name: Create Issue on Failure
        if: steps.verify.outputs.VERIFY_SUCCESS != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Release ${{ steps.release-info.outputs.TAG_NAME }} - Verification Failed`,
              body: `## Release Verification Failed\n\n**Version:** ${{ steps.release-info.outputs.TAG_NAME }}\n**Commit:** ${{ steps.commit-info.outputs.COMMIT_SHORT }}\n\n### Status:\n- Windows: ${{ steps.verify.outputs.WIN_STATUS }}\n- Linux: ${{ steps.verify.outputs.LINUX_STATUS }}\n\n### Details:\n- Windows Size: ${{ steps.verify.outputs.WIN_SIZE_MB }}MB\n- Linux Size: ${{ steps.verify.outputs.LINUX_SIZE_MB }}MB\n\nPlease check the release artifacts and re-run workflows if needed.`,
              labels: ['bug', 'release']
            })