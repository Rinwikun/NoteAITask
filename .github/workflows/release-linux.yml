name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'NoteAITask/NoteAITask.csproj'
  BUILD_CONFIG: 'Release'
  RUNTIME: 'linux-x64'
  ARTIFACT_NAME: 'NoteAITask-Linux-x64'

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Obfuscar Global Tool
        run: dotnet tool install --global Obfuscar.GlobalTool

      - name: Add .NET Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Step 1 - Build Loose Assemblies
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=false /p:PublishReadyToRun=false

      - name: Step 2 - Run Obfuscar (Linux)
        continue-on-error: true
        run: |
          PUBLISH_DIR="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish"
          OBFUSCAR_XML="NoteAITask/obfuscar.xml"
          
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "⚠️ Publish directory not found, skipping obfuscation"
            exit 0
          fi
          
          if [ ! -f "$OBFUSCAR_XML" ]; then
            echo "⚠️ obfuscar.xml not found, skipping obfuscation"
            exit 0
          fi

          cd "$PUBLISH_DIR"
          echo "Running Obfuscar from: $(pwd)"
          
          $HOME/.dotnet/tools/obfuscar.console "$(pwd -P)/../../../../../$OBFUSCAR_XML" || echo "⚠️ Obfuscar failed, continuing without obfuscation"

          if [ -f "./protected/NoteAITask.dll" ]; then
            cp -f ./protected/NoteAITask.dll ./NoteAITask.dll
            rm -rf ./protected
            echo "✅ Obfuscated assembly applied."
          fi

      - name: Step 3 - Final Single-File Bundle
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c ${{ env.BUILD_CONFIG }} -r ${{ env.RUNTIME }} --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=false --no-restore

      - name: Verify Build Output
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/NoteAITask"
          
          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Build failed: Binary not found at $BINARY_PATH"
            exit 1
          fi
          
          FILE_SIZE=$(du -h "$BINARY_PATH" | cut -f1)
          echo "✅ Build successful. File size: $FILE_SIZE"

      - name: Rename Output Binary
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/NoteAITask"
          PUBLISH_DIR="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish"
          RENAMED_PATH="$PUBLISH_DIR/${{ env.ARTIFACT_NAME }}"
          
          if [ ! -f "$BINARY_PATH" ]; then
            echo "❌ Binary not found: $BINARY_PATH"
            exit 1
          fi
          
          mv "$BINARY_PATH" "$RENAMED_PATH"
          echo "✅ Renamed to: $(basename $RENAMED_PATH)"

      - name: Make Linux Binary Executable
        run: |
          BINARY_PATH="NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/${{ env.ARTIFACT_NAME }}"
          chmod +x "$BINARY_PATH"
          echo "✅ Binary is executable"

      - name: Upload Linux Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: NoteAITask/bin/${{ env.BUILD_CONFIG }}/net10.0/${{ env.RUNTIME }}/publish/${{ env.ARTIFACT_NAME }}
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Failed Notification
        if: failure()
        run: echo "❌ Build workflow failed. Check logs above for details."